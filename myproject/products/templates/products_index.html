{% extends "master.html" %}

{% block title %}
    main products page
{% endblock  %}

{% block body %}
    <h1>all products:</h1>
    <ul>
        {% for product in all_products %}
            <li><a href="{% url 'product_detail' product.id %}">{{ product.title }} ({{ product.price }})</a></li>
            <br>
        {% endfor %}
    </ul>

{% endblock  %}
