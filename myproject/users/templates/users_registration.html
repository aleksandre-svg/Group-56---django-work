{% extends "master.html" %}

{% block title %}
    registration page
{% endblock %}

{% block body %}
    <h1>Registration</h1>
    <form method='POST'>
        {% csrf_token %}
        
        <input type="email" name='user_email' placeholder='email'><br><br>
        <input type="text" name='user_name' placeholder='username'><br><br>
        <input type="number" name='user_age' placeholder='age'><br><br>
        <input type="password" name='password' placeholder='passwors'><br><br>

        <input type="submit">
    </form>
{% endblock  %}
