<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>edit user</h1>
    <form method='POST'>
        {% csrf_token %}
        <input type="email" name='user_email' placeholder='email' value='{{ current_user.email }}'><br><br>
        <input type="text" name='user_name' placeholder='username' value='{{ current_user.username }}'><br><br>
        <input type="number" name='user_age' placeholder='age' value='{{ current_user.age }}'><br><br>
        <input type="password" name='password' placeholder='passwors' value='{{ current_user.password }}'><br><br>
        <input type="submit">
    </form>
</body>
</html>
